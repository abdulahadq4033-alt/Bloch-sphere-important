<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bloch Sphere — Interactive</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #040810; --panel: rgba(6,16,32,0.85);
    --cyan: #00e5ff; --pink: #ff2d78; --gold: #ffd23f;
    --green: #39ff14; --text: #c8d8f0; --dim: #4a6080;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Share Tech Mono', monospace;
         height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
  header { padding: 10px 16px 6px; display: flex; align-items: baseline; gap: 12px;
           border-bottom: 1px solid rgba(0,229,255,0.15);
           background: var(--panel); backdrop-filter: blur(10px); z-index: 10; }
  header h1 { font-family: 'Orbitron', monospace; font-size: clamp(13px,3vw,18px);
              color: var(--cyan); letter-spacing: .12em; text-shadow: 0 0 12px var(--cyan); }
  header span { font-size: 11px; color: var(--dim); letter-spacing: .05em; }
  #canvas-wrap { flex: 1; position: relative; touch-action: none; }
  canvas { display: block; width: 100% !important; height: 100% !important; }
  #controls { position: absolute; top: 12px; right: 12px; width: 200px;
              background: var(--panel); border: 1px solid rgba(0,229,255,.2);
              border-radius: 8px; padding: 12px; backdrop-filter: blur(14px); z-index: 5; font-size: 11px; }
  #controls h2 { font-family: 'Orbitron', monospace; font-size: 10px; color: var(--cyan);
                 letter-spacing: .15em; margin-bottom: 10px; text-transform: uppercase; }
  .ctrl-row { display: flex; align-items: center; justify-content: space-between;
              margin-bottom: 8px; gap: 8px; }
  .ctrl-row label { color: var(--dim); font-size: 10px; white-space: nowrap; }
  .ctrl-row input[type=range] { flex: 1; accent-color: var(--cyan); height: 2px; }
  .ctrl-row .val { color: var(--cyan); font-size: 10px; width: 36px; text-align: right; }
  .gate-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 5px; margin-top: 4px; }
  .gate-btn { background: rgba(0,229,255,.08); border: 1px solid rgba(0,229,255,.3);
              color: var(--cyan); font-family: 'Orbitron', monospace; font-size: 10px;
              padding: 5px 2px; border-radius: 4px; cursor: pointer; text-align: center;
              transition: background .15s, box-shadow .15s; user-select: none; }
  .gate-btn:hover,.gate-btn:active { background: rgba(0,229,255,.22); box-shadow: 0 0 8px var(--cyan); }
  .gate-btn.h-gate { border-color: var(--gold); color: var(--gold); }
  .gate-btn.h-gate:hover { background: rgba(255,210,63,.18); box-shadow: 0 0 8px var(--gold); }
  .sep { border: none; border-top: 1px solid rgba(255,255,255,.08); margin: 10px 0; }
  #state-box { position: absolute; bottom: 12px; left: 12px; background: var(--panel);
               border: 1px solid rgba(0,229,255,.15); border-radius: 8px; padding: 10px 14px;
               font-size: 11px; backdrop-filter: blur(14px); z-index: 5; min-width: 190px; }
  #state-box h2 { font-family: 'Orbitron', monospace; font-size: 9px; color: var(--cyan);
                  letter-spacing: .15em; margin-bottom: 8px; }
  .state-line { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .state-line .lbl { color: var(--dim); } .state-line .val { color: var(--text); }
  #measure-btn { margin-top: 8px; width: 100%; background: rgba(255,45,120,.1);
                 border: 1px solid var(--pink); color: var(--pink);
                 font-family: 'Orbitron', monospace; font-size: 9px; letter-spacing: .1em;
                 padding: 6px; border-radius: 4px; cursor: pointer; transition: background .15s; }
  #measure-btn:hover { background: rgba(255,45,120,.22); }
  #measure-result { margin-top: 6px; text-align: center; font-size: 12px; min-height: 16px;
                    color: var(--gold); font-family: 'Orbitron', monospace; }
  .grid-lines { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(rgba(0,229,255,.025) 1px,transparent 1px),
                linear-gradient(90deg,rgba(0,229,255,.025) 1px,transparent 1px);
    background-size: 40px 40px; }
  #hint { position: absolute; bottom: 12px; right: 12px; font-size: 10px; color: var(--dim);
          text-align: right; pointer-events: none; }
</style>
</head>
<body>
<header><h1>BLOCH SPHERE</h1><span>INTERACTIVE QUANTUM STATE VISUALIZER</span></header>
<div id="canvas-wrap">
  <div class="grid-lines"></div>
  <canvas id="c"></canvas>
  <div id="controls">
    <h2>⟨ State Control ⟩</h2>
    <div class="ctrl-row"><label>θ (polar)</label>
      <input type="range" id="theta" min="0" max="180" value="0" step="1">
      <span class="val" id="theta-val">0°</span></div>
    <div class="ctrl-row"><label>φ (azimuth)</label>
      <input type="range" id="phi" min="0" max="360" value="0" step="1">
      <span class="val" id="phi-val">0°</span></div>
    <hr class="sep">
    <h2>⟨ Quantum Gates ⟩</h2>
    <div class="gate-grid">
      <button class="gate-btn" onclick="applyGate('X')">X</button>
      <button class="gate-btn" onclick="applyGate('Y')">Y</button>
      <button class="gate-btn" onclick="applyGate('Z')">Z</button>
      <button class="gate-btn h-gate" onclick="applyGate('H')">H</button>
      <button class="gate-btn" onclick="applyGate('S')">S</button>
      <button class="gate-btn" onclick="applyGate('T')">T</button>
      <button class="gate-btn" onclick="applyGate('Rx')">Rx</button>
      <button class="gate-btn" onclick="applyGate('Ry')">Ry</button>
      <button class="gate-btn" onclick="applyGate('Rz')">Rz</button>
    </div>
    <hr class="sep">
    <div class="ctrl-row"><label>Rotation step</label>
      <input type="range" id="rot-step" min="5" max="90" value="30" step="5">
      <span class="val" id="rot-val">30°</span></div>
  </div>
  <div id="state-box">
    <h2>⟨ Quantum State ⟩</h2>
    <div class="state-line"><span class="lbl">|0⟩ prob</span><span class="val" id="p0">100.0%</span></div>
    <div class="state-line"><span class="lbl">|1⟩ prob</span><span class="val" id="p1">0.0%</span></div>
    <div class="state-line"><span class="lbl">Bloch X</span><span class="val" id="bx">0.000</span></div>
    <div class="state-line"><span class="lbl">Bloch Y</span><span class="val" id="by">0.000</span></div>
    <div class="state-line"><span class="lbl">Bloch Z</span><span class="val" id="bz">1.000</span></div>
    <button id="measure-btn" onclick="measure()">⚡ MEASURE</button>
    <div id="measure-result"></div>
  </div>
  <div id="hint">drag to rotate · pinch/scroll to zoom</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas=document.getElementById('c'),wrap=document.getElementById('canvas-wrap');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x000000,0);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,1,0.01,100);
camera.position.set(2.5,1.8,2.5);camera.lookAt(0,0,0);
scene.add(new THREE.AmbientLight(0x334455,2));
const dl=new THREE.DirectionalLight(0x00e5ff,1.2);dl.position.set(3,5,3);scene.add(dl);
const sphereMat=new THREE.MeshPhongMaterial({color:0x003355,transparent:true,opacity:.22,side:THREE.FrontSide,shininess:80});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(1,48,48),sphereMat));
const wfMat=new THREE.MeshBasicMaterial({color:0x00e5ff,wireframe:true,transparent:true,opacity:.07});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(1,24,16),wfMat));
function mkCircle(r,axis,color){
  const pts=[];
  for(let i=0;i<=128;i++){const a=i/128*Math.PI*2;
    if(axis==='z')pts.push(new THREE.Vector3(r*Math.cos(a),r*Math.sin(a),0));
    if(axis==='y')pts.push(new THREE.Vector3(r*Math.cos(a),0,r*Math.sin(a)));
    if(axis==='x')pts.push(new THREE.Vector3(0,r*Math.cos(a),r*Math.sin(a)));
  }
  return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color,transparent:true,opacity:.4}));
}
scene.add(mkCircle(1,'z',0x00e5ff));scene.add(mkCircle(1,'y',0x0088aa));scene.add(mkCircle(1,'x',0x004466));
const arrowGroup=new THREE.Group();scene.add(arrowGroup);
const shaftMat=new THREE.MeshPhongMaterial({color:0xffd23f,emissive:0xffd23f,emissiveIntensity:.6});
const shaft=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,1,12),shaftMat);shaft.position.y=.5;arrowGroup.add(shaft);
const headMat=new THREE.MeshPhongMaterial({color:0xffd23f,emissive:0xffd23f,emissiveIntensity:.8});
const head=new THREE.Mesh(new THREE.ConeGeometry(.06,.18,12),headMat);head.position.y=1.09;arrowGroup.add(head);
const glowMat=new THREE.MeshBasicMaterial({color:0xffd23f,transparent:true,opacity:.85});
const glow=new THREE.Mesh(new THREE.SphereGeometry(.07,16,16),glowMat);glow.position.y=1.15;arrowGroup.add(glow);
const tPts=[],tGeo=new THREE.BufferGeometry();
const tLine=new THREE.Line(tGeo,new THREE.LineBasicMaterial({color:0xffd23f,transparent:true,opacity:.35}));scene.add(tLine);
let theta=0,phi=0;
function blochVec(th,ph){const t=th*Math.PI/180,p=ph*Math.PI/180;return{x:Math.sin(t)*Math.cos(p),y:Math.sin(t)*Math.sin(p),z:Math.cos(t)};}
function setArrow(th,ph){
  const v=blochVec(th,ph);const tx=v.x,ty=v.z,tz=-v.y;
  arrowGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),new THREE.Vector3(tx,ty,tz).normalize());
  if(tPts.length>300)tPts.splice(0,1);
  tPts.push(new THREE.Vector3(tx*1.04,ty*1.04,tz*1.04));tGeo.setFromPoints(tPts);
  const t2=th*Math.PI/180;
  document.getElementById('p0').textContent=(Math.cos(t2/2)**2*100).toFixed(1)+'%';
  document.getElementById('p1').textContent=(Math.sin(t2/2)**2*100).toFixed(1)+'%';
  document.getElementById('bx').textContent=v.x.toFixed(3);
  document.getElementById('by').textContent=v.y.toFixed(3);
  document.getElementById('bz').textContent=v.z.toFixed(3);
}
const tS=document.getElementById('theta'),pS=document.getElementById('phi'),rS=document.getElementById('rot-step');
tS.addEventListener('input',()=>{theta=+tS.value;document.getElementById('theta-val').textContent=theta+'°';setArrow(theta,phi);});
pS.addEventListener('input',()=>{phi=+pS.value;document.getElementById('phi-val').textContent=phi+'°';setArrow(theta,phi);});
rS.addEventListener('input',()=>{document.getElementById('rot-val').textContent=rS.value+'°';});
function norm(t,p){t=((t%360)+360)%360;if(t>180){t=360-t;p=(p+180)%360;}p=((p%360)+360)%360;return{t,p};}
let anim=null,animFrom=null,animT=1;
function animateTo(th,ph){animFrom={t:theta,p:phi};anim={t:th,p:ph};animT=0;}
function applyGate(gate){
  let step=+rS.value,t=theta,p=phi;
  if(gate==='X'){t=180-t;p=(p+180)%360;}
  else if(gate==='Y'){t=180-t;p=(360-p)%360;}
  else if(gate==='Z'){p=(p+180)%360;}
  else if(gate==='H'){const v=blochVec(t,p);const nx=v.z,ny=-v.y,nz=v.x;
    t=Math.acos(Math.max(-1,Math.min(1,nz)))*180/Math.PI;
    p=((Math.atan2(ny,nx)*180/Math.PI)%360+360)%360;}
  else if(gate==='S'){p=(p+90)%360;}
  else if(gate==='T'){p=(p+45)%360;}
  else if(gate==='Rx'){t=(t+step)%360;}
  else{p=(p+step)%360;}
  const r=norm(t,p);theta=r.t;phi=r.p;
  tS.value=theta;pS.value=phi;
  document.getElementById('theta-val').textContent=Math.round(theta)+'°';
  document.getElementById('phi-val').textContent=Math.round(phi)+'°';
  animateTo(theta,phi);
}
function measure(){
  const t=theta*Math.PI/180,p0=Math.cos(t/2)**2;
  const out=Math.random()<p0?'|0⟩':'|1⟩';
  document.getElementById('measure-result').textContent='→ '+out;
  theta=out==='|0⟩'?0:180;phi=0;tS.value=theta;pS.value=phi;
  document.getElementById('theta-val').textContent=theta+'°';
  document.getElementById('phi-val').textContent=phi+'°';
  setArrow(theta,phi);
}
let drag=false,prev={x:0,y:0},rotY=Math.atan2(2.5,2.5),rotX=.38,camD=4.2;
function updCam(){camera.position.set(camD*Math.cos(rotX)*Math.sin(rotY),camD*Math.sin(rotX),camD*Math.cos(rotX)*Math.cos(rotY));camera.lookAt(0,0,0);}
wrap.addEventListener('mousedown',e=>{drag=true;prev={x:e.clientX,y:e.clientY};});
window.addEventListener('mouseup',()=>drag=false);
window.addEventListener('mousemove',e=>{if(!drag)return;rotY-=(e.clientX-prev.x)*.005;rotX=Math.max(-1.4,Math.min(1.4,rotX+(e.clientY-prev.y)*.005));prev={x:e.clientX,y:e.clientY};updCam();});
wrap.addEventListener('wheel',e=>{camD=Math.max(1.5,Math.min(8,camD+e.deltaY*.005));updCam();},{passive:true});
let lT=null;
wrap.addEventListener('touchstart',e=>{if(e.touches.length===1){drag=true;prev={x:e.touches[0].clientX,y:e.touches[0].clientY};}lT=e.touches;},{passive:true});
wrap.addEventListener('touchend',()=>{drag=false;lT=null;});
wrap.addEventListener('touchmove',e=>{
  if(e.touches.length===1&&drag){rotY-=(e.touches[0].clientX-prev.x)*.005;rotX=Math.max(-1.4,Math.min(1.4,rotX+(e.touches[0].clientY-prev.y)*.005));prev={x:e.touches[0].clientX,y:e.touches[0].clientY};updCam();}
  else if(e.touches.length===2&&lT?.length===2){const d0=Math.hypot(lT[0].clientX-lT[1].clientX,lT[0].clientY-lT[1].clientY);const d1=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);camD=Math.max(1.5,Math.min(8,camD-(d1-d0)*.01));updCam();}
  lT=e.touches;},{passive:true});
updCam();
function resize(){const w=wrap.clientWidth,h=wrap.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();
setArrow(0,0);
function render(t){
  glowMat.opacity=.7+.3*Math.sin(t*.003);
  if(animT<1&&anim){animT=Math.min(1,animT+.06);const e=1-(1-animT)**3;setArrow(animFrom.t+(anim.t-animFrom.t)*e,animFrom.p+(anim.p-animFrom.p)*e);if(animT>=1){theta=anim.t;phi=anim.p;}}
  renderer.render(scene,camera);requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
